name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      # The official SRD PDF is not distributed with the repository, so CI
      # runs every gate except the PDF-extraction parity check; the corpus
      # builder asserts the registered PDF digest whenever the file exists.
      - run: make ci-check
      # The pipeline regenerates artifacts in place; a dirty tree here means
      # the committed generated files did not match a clean build.
      - run: git diff --exit-code && test -z "$(git status --porcelain)"
